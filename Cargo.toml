[workspace]
members = ["crates/enouia-common", "crates/enouia-activity-contract", "crates/enouia-activity", "crates/enouia-windows-process", "crates/enouia-activity-store", "crates/enouia-activity-delivery"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
