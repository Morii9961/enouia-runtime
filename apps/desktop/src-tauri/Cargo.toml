[package]
name = "enouia-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Keep the optional GUI build independent of the offline domain workspace.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
# Enouia Memory's embedded workspace Core at a pinned revision (ADR-025,
# ADR-MEM-45). Change `rev` only together with Cargo.lock and
# docs/integration/memory-pin.json; never a branch, path or [patch].
enouia-memory-workspace = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }
# The pinned contract's command catalog (long-running and write commands).
enouia-memory-contract = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }
# Native text Provider dispatch the Core hosts (Enouia Memory ADR-MEM-48):
# HTTPS transport, Windows credential store and capability types.
enouia-memory-provider = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }
# Separate opt-in synthetic automation adapter; never the v1 workspace writer.
enouia-memory-host = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }
enouia-memory-vault = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }
# Native dialogs for the Memory picker; pinned to the reference shell's version.
rfd = { version = "=0.17.2", default-features = false }
# Must equal Enouia Memory's exact workspace pins.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
# Native hotkey, Runtime directory reservation and main's opt-in startup.
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Tests only: seeds a synthetic Identity and public records for the public
# persona export consumer test (Workspace IPC v1 has no Identity write).
enouia-memory-govern = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "731edd56a276ffa752c736b7d2be667b9e12776c" }

# Same debug-info policy as the domain workspace: line tables for our code only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
