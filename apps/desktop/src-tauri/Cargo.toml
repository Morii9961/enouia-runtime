[package]
name = "enouia-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Keep the optional GUI build independent of the offline domain workspace.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
