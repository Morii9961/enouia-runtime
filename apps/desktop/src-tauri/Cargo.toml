[package]
name = "enouia-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

# Keep the optional GUI build independent of the offline domain workspace.
[workspace]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
# Enouia Memory's embedded workspace Core at a pinned revision (ADR-025,
# ADR-MEM-45). Change `rev` only together with Cargo.lock and
# docs/integration/memory-pin.json; never a branch, path or [patch].
enouia-memory-workspace = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "ff692ccb6fbc1c387254d5ffbef41b105eeb2a84" }
# The pinned contract's command catalog (long-running and write commands).
enouia-memory-contract = { git = "https://github.com/Morii9961/enouia-memory.git", rev = "ff692ccb6fbc1c387254d5ffbef41b105eeb2a84" }
# Native dialogs for the Memory picker; pinned to the reference shell's version.
rfd = { version = "=0.17.2", default-features = false }
# Must equal Enouia Memory's exact workspace pin.
serde_json = "=1.0.151"

# Global hotkey and opt-in login startup (ADR-026), as in Memory's reference shell.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Same debug-info policy as the domain workspace: line tables for our code only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
