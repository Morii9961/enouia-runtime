[package]
name = "enouia-windows-process"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
enouia-common = { path = "../enouia-common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
enouia-activity = { path = "../enouia-activity" }
