[package]
name = "enouia-usage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
enouia-common = { path = "../enouia-common" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus"] }
